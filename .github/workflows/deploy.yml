name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: mkdir -p _site && rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c5e647d7c968bcef886d5eda410bc2eb
          command: pages deploy _site --project-name nanzhaoarts --branch main --commit-dirty=true
